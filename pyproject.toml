[project]
name = "mcp-client-server"
version = "0.1.0"
description = "One service for AI agent tasks: a REST API, an MCP endpoint, live events, and Apple push notifications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cbor2>=6.1",
    "cryptography>=50",
    "fastapi>=0.143",
    "httptools>=0.9",
    "httpx2[http2]>=2.13.1",
    "mcp>=2.3,<3",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "pyjwt[crypto]>=2.15.1",
    "redis[hiredis]>=8.1",
    "uvicorn>=0.54",
    "uvloop>=0.23; sys_platform != 'win32'",
]

[project.scripts]
mcp-client-server = "mcp_client_server.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15",
    "fakeredis[lua]>=2.39",
    "hypothesis>=6.168",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "DTZ", "E", "ERA", "F", "FAST", "FBT", "FLY", "FURB",
    "G", "I", "ICN", "INP", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "Q", "RET", "RSE", "RUF",
    "S", "SIM", "SLF", "SLOT", "T10", "T20", "TID", "TRY", "UP", "W",
]
ignore = [
    "N818",    # The error classes use HTTP status names (NotFound, Conflict).
    "TRY003",  # A message that goes to the client is written where the error is raised.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # pytest uses assert.
    "PLR2004",  # A test compares with literal values.
    "PLR0913",  # A test takes its fixtures as arguments.
    "PLR0915",  # A flow test has many steps.
    "ARG",      # A fake keeps the signature of the real object, and a fixture can be requested for its effect.
    "FBT001",   # pytest gives each parameter by name.
]
"scripts/*" = ["INP001", "T201", "S101"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
reportImplicitOverride = true
reportPropertyTypeMismatch = true
enableTypeIgnoreComments = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
anyio_mode = "auto"
filterwarnings = ["error"]
