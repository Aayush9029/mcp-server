[project]
name = "mcp-client-server"
version = "0.1.0"
description = "One service for AI agent tasks: a REST API, an MCP endpoint, live events, and Apple push notifications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx[http2]>=0.28.1",
    "mcp>=2.3.0,<3",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "redis[hiredis]>=5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mcp-client-server = "mcp_client_server.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.39.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PT", "C4", "PIE", "RET", "TID"]
ignore = ["PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109", "ASYNC110"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
strict = ["src"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
anyio_mode = "auto"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
